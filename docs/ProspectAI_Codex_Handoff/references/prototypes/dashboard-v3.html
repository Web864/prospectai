<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProspectAI — Dashboard Redesign Concept</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#f7f9fa;--panel:#fff;--ink:#101d2c;--muted:#627486;--border:#e1e8ec;--green:#098568;--mint:#e7f5ef;--side:#101d2c;--sideText:#b8c7d2;--soft:#f1f5f6;--danger:#d35e6f}*{box-sizing:border-box}body{margin:0;font:14px/1.55 'DM Sans',sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #58bda4;outline-offset:2px}h1,h2,h3{font-family:Manrope,sans-serif;letter-spacing:-.045em;margin:0}h1{font-size:30px}h2{font-size:18px}h3{font-size:15px}p{margin:0;color:var(--muted)}.app{display:flex;min-height:100vh}.side{width:250px;flex:none;position:sticky;top:0;height:100vh;background:var(--side);color:white;display:flex;flex-direction:column;padding:26px 15px 16px}.logo{font:800 21px Manrope;letter-spacing:-1px;display:flex;align-items:center;gap:10px;padding:3px 12px 35px}.mark{background:var(--green);border-radius:11px;width:34px;height:34px;display:grid;place-items:center;color:white;font-size:20px}.sectionlabel{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#8ca3b4;padding:0 13px 13px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{color:var(--sideText);border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:10px;display:flex;align-items:center;gap:13px;font-weight:700;width:100%}.nav button:hover{background:#1b3442;color:white}.nav button.active{background:#1b4b49;color:#fff;box-shadow:inset 3px 0 #39c6a6}.symbol{font-size:18px;width:19px;text-align:center;font-weight:400}.sidemeta{margin-top:auto;border:1px solid #314554;border-radius:12px;padding:15px;color:#b0c7d0;font-size:12px}.sidemeta strong{color:#fff;display:block;margin-bottom:3px}.main{min-width:0;flex:1}.top{height:79px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:15px;padding:0 37px}.topsearch{flex:1;background:var(--bg);padding:13px 16px;border:1px solid var(--border);border-radius:10px;color:var(--muted);max-width:580px}.topactions{display:flex;gap:9px;margin-left:auto}.iconbtn{width:41px;height:41px;border:1px solid var(--border);background:var(--panel);border-radius:10px;color:var(--ink)}.avatar{border-radius:10px;background:#e3f3ee;color:var(--green);font-weight:800;width:41px;height:41px;border:0}.content{padding:35px 38px 85px;max-width:1560px;margin:auto}.eyebrow{font-size:12px;color:#8494a1;margin-bottom:11px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:30px}.subtitle{margin-top:7px}.btn{border:1px solid transparent;background:var(--green);color:#fff;font-weight:700;border-radius:10px;padding:12px 18px;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:42px}.btn.secondary{border-color:var(--border);background:var(--panel);color:var(--ink)}.btn:hover{filter:brightness(.96)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:25px}.stat{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:20px 22px;min-width:0}.stathead{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}.stathead .emblem{color:var(--green);background:var(--mint);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-size:17px}.stat strong{font:800 31px Manrope;display:block;margin-top:13px;letter-spacing:-.07em}.stat small{font-size:11px;color:#8393a2}.surface{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-top:18px}.surfacepad{padding:24px}.toolrow{padding:19px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;flex-wrap:wrap;gap:13px}.tabs{display:flex;gap:19px;align-self:stretch;align-items:center;margin-right:auto}.tab{background:none;border:0;color:var(--muted);font-size:12px;font-weight:700;padding:12px 0;white-space:nowrap}.tab.selected{color:var(--green);box-shadow:inset 0 -2px var(--green)}.field{border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--ink);padding:10px 12px;min-width:0;max-width:100%}.field.search{width:265px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:820px;text-align:left}th{background:var(--soft);color:#687a89;font-size:11px;font-weight:800;padding:16px 22px;white-space:nowrap}td{padding:17px 22px;border-top:1px solid var(--border);font-size:12px}.empty{text-align:center;padding:65px 25px 70px;max-width:650px;margin:auto}.emptyIcon{height:63px;width:63px;border-radius:18px;background:var(--mint);color:var(--green);display:grid;place-items:center;font-size:27px;margin:0 auto 20px}.empty h2{margin-bottom:9px}.empty p{margin:0 auto 20px;max-width:480px;font-size:13px}.stack{display:grid;gap:17px}.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(275px,1fr);gap:18px}.subhead{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}.hint{font-size:12px;color:var(--muted)}.progress{height:9px;background:#e8eef0;border-radius:12px;overflow:hidden;margin-top:16px}.progress span{display:block;height:100%;background:var(--green);width:10%;border-radius:12px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:18px}.feature{padding:18px;border:1px solid var(--border);border-radius:12px;background:var(--panel)}.feature b{display:block;margin:9px 0 4px}.feature p{font-size:12px}.setting{display:flex;gap:15px;align-items:flex-start;padding:16px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px}.setting span{font-size:20px;color:var(--green)}.setting p{font-size:12px}.state{display:inline-flex;background:var(--mint);color:#087358;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:800}.state.grey{background:var(--soft);color:var(--muted)}.billing{padding:25px;background:linear-gradient(110deg,var(--panel),#f2faf6);border:1px solid #dcece5;border-radius:16px}.dark{--bg:#0c161d;--panel:#13252f;--ink:#e8f2f5;--muted:#afc0ca;--border:#29404b;--soft:#1a303a;--mint:#164a40;--side:#08141b;--sideText:#b6cbd1}.dark .topsearch{background:#172a33}.dark .billing{background:#142b31}.dark .avatar{background:#164a40;color:#8edfcc}.dark .progress{background:#29404b}.dark .sidemeta{border-color:#314554}.mobileToggle{display:none}.note{padding:14px 18px;border-left:3px solid var(--green);background:var(--mint);font-size:12px;color:var(--muted);border-radius:8px;margin-top:15px}.caption{font-size:11px;color:var(--muted)}@media(max-width:1160px){.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.features{grid-template-columns:1fr 1fr}}@media(max-width:800px){.side{position:fixed;z-index:100;transform:translateX(-100%);transition:transform .2s}.side.show{transform:translateX(0)}.mobileToggle{display:inline-block}.content{padding:26px 18px 60px}.top{padding:0 16px}.topsearch{display:none}.intro{align-items:start;flex-direction:column}.features{grid-template-columns:1fr}}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px}.stat strong{font-size:24px}.topactions{gap:5px}.tab{font-size:11px}.tabs{gap:11px}.field.search{width:100%}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="logo"><span class="mark">P</span>Prospect<span style="color:#31c5a5">AI</span></div><div class="sectionlabel">Workspace</div><nav class="nav" id="nav"></nav><div class="sidemeta"><strong>◈ Evidence first</strong>Opportunity-focused prospecting.<div style="margin-top:12px;font-size:10px;opacity:.7">UI CONCEPT · SAMPLE DATA ONLY</div></div></aside><div class="main"><header class="top"><button class="iconbtn mobileToggle" onclick="document.getElementById('side').classList.toggle('show')" aria-label="Open navigation">☰</button><div class="topsearch">⌕ &nbsp; Search workspace</div><div class="topactions"><button class="iconbtn" id="theme" aria-label="Toggle color theme" title="Toggle theme">☾</button><button class="iconbtn" aria-label="Notifications" title="Design preview only">♧</button><button class="iconbtn" aria-label="Help" title="Design preview only">?</button><button class="avatar" aria-label="Demo user">PA</button></div></header><main class="content" id="content"></main></div></div><script>
const names=['Dashboard','Research','Analyses','Opportunities','Leads','Pitches','Usage','Billing','Settings','Extension']; const icons=['⌂','⌕','▥','◇','♙','▤','◷','▱','⚙','⬡'];let current='Analyses', tab='All analyses', theme='light';const nav=document.getElementById('nav'),target=document.getElementById('content');
function renderNav(){nav.innerHTML=names.map((n,i)=>`<button class="${n===current?'active':''}" onclick="go('${n}')"><span class="symbol">${icons[i]}</span>${n}</button>`).join('')}function go(n){current=n;tab='All analyses';renderNav();render();document.getElementById('side').classList.remove('show')}
const btn=(text,goTo,secondary=false)=>`<button class="btn ${secondary?'secondary':''}" onclick="go('${goTo}')">${text}</button>`;const head=(description,action='')=>`<div class="eyebrow">Workspace &nbsp; / &nbsp; ${current}</div><div class="intro"><div><h1>${current}</h1><p class="subtitle">${description}</p></div>${action}</div>`;
const stats=(items)=>`<section class="stats">${items.map(([label,value,sub,icon])=>`<div class="stat"><div class="stathead"><span>${label}</span><span class="emblem">${icon}</span></div><strong>${value}</strong><small>${sub}</small></div>`).join('')}</section>`;
const empty=(icon,title,description,action='',secondary='')=>`<div class="empty"><div class="emptyIcon">${icon}</div><h2>${title}</h2><p>${description}</p>${action}${secondary}</div>`;
const filter=()=>`<section class="surface"><div class="toolrow"><div class="tabs">${['All analyses','Completed','In progress','Failed'].map(n=>`<button class="tab ${tab===n?'selected':''}" onclick="tab='${n}';render()">${n}</button>`).join('')}</div><input class="field search" aria-label="Search websites" placeholder="⌕  Search websites or companies"><select class="field" aria-label="Status"><option>All statuses</option><option>Completed</option><option>In progress</option><option>Failed</option></select><select class="field" aria-label="Sort"><option>Newest first</option><option>Oldest first</option></select></div><div class="tablewrap"><table><thead><tr>${['Website','Company','Status','Website score','Opportunity score','Analyzed at','Actions'].map(x=>`<th>${x}</th>`).join('')}</tr></thead></table></div>${empty('▤',tab==='All analyses'?'No analysis records in this preview':`No ${tab.toLowerCase()} records in this preview`,'Use Research to begin a website analysis. Your real workspace results would populate this table.',btn('+ Start research','Research'))}</section>`;
function render(){let out='';switch(current){case 'Analyses':out=head('Track website research, processing progress, and analysis results.',btn('+ New analysis','Research'))+stats([['Total analyses','4','Illustrative from supplied screen','▤'],['Completed','3','Illustrative from supplied screen','✓'],['In progress','1','Illustrative from supplied screen','◷'],['Failed','0','Illustrative from supplied screen','!']])+filter();break;
case 'Dashboard':out=head('Your research and prospecting workspace.',btn('+ Analyze website','Research'))+stats([['Analyses','4','Sample from screenshot','▤'],['Opportunities','0','No examples loaded','◇'],['Leads','0','No saved leads','♙'],['Pitches','0','No pitches created','▤']])+`<div class="split"><section class="surface surfacepad"><div class="subhead"><h2>Start with a business website</h2><span class="state">Next action</span></div><p>Research a website, review evidence, identify a relevant opportunity, and save a prospect.</p><div style="margin-top:20px">${btn('Start website research →','Research')}</div></section><section class="surface surfacepad"><h2>Workflow</h2><div class="stack" style="margin-top:17px">${['01 · Research','02 · Review opportunities','03 · Save leads','04 · Create pitches'].map(x=>`<div class="setting" style="margin:0">${x}</div>`).join('')}</div></section></div>`;break;
case 'Research':out=head('Analyze public website signals to inform better prospecting.')+`<section class="surface surfacepad"><div class="subhead"><h2>Analyze a website</h2><span class="state">Core workflow</span></div><p>Enter a business website to begin your research. This is a design preview, not a live analyzer.</p><div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap"><input id="url" class="field" style="flex:1;min-width:230px" placeholder="https://example-business.com" aria-label="Website URL"><button class="btn" onclick="document.getElementById('feedback').textContent='Preview only: no website was analyzed.'">Analyze website →</button></div><p id="feedback" style="margin-top:12px;font-size:12px" aria-live="polite"></p></section><div class="features"><div class="feature"><span class="state">01</span><b>Find the signals</b><p>Gather relevant public website evidence.</p></div><div class="feature"><span class="state">02</span><b>Interpret the context</b><p>Separate observations from possible business needs.</p></div><div class="feature"><span class="state">03</span><b>Explore opportunities</b><p>Review suggestions before saving or creating outreach.</p></div></div>`;break;
case 'Opportunities':out=head('Prioritize potential services and review supporting evidence.')+stats([['Total opportunities','0','From current screenshot','◇'],['High priority','0','Score 70+','↗'],['Average score','—','When available','◈'],['Categories','0','Suggested services','▦']])+`<section class="surface"><div class="toolrow"><input class="field search" placeholder="⌕  Search opportunities" aria-label="Search opportunities"></div>${empty('◇','No opportunities yet','Complete an analysis to begin evaluating evidence-backed opportunities.',btn('Analyze a website','Research'))}</section>`;break;
case 'Leads':out=head('Manage researched businesses from discovery to outreach.')+`<section class="stats" style="grid-template-columns:repeat(5,minmax(0,1fr))">${[['Total leads','0','Saved prospects','♙'],['Qualified','0','High potential','✓'],['Contacted','0','Outreach started','➤'],['Meetings','0','Booked','▦'],['Won clients','0','Converted','★']].map(([a,b,c,d])=>`<div class="stat"><div class="stathead">${a}<span class="emblem">${d}</span></div><strong>${b}</strong><small>${c}</small></div>`).join('')}</section><section class="surface"><div class="toolrow"><input class="field search" placeholder="⌕  Search companies" aria-label="Search companies"><select class="field"><option>All statuses</option><option>Qualified</option><option>Contacted</option></select><input class="field" placeholder="Industry" aria-label="Industry"><input class="field" placeholder="Location" aria-label="Location"></div>${empty('♙','Your prospect list starts here','Save a researched opportunity as a lead to begin managing outreach.',btn('Find opportunities','Opportunities'))}</section>`;break;
case 'Pitches':out=head('Build specific outreach based on verified research.')+`<section class="surface">${empty('▤','No pitches created yet','Use a researched opportunity as the starting point for personalized outreach.',btn('View opportunities','Opportunities'))}</section><div class="features"><div class="feature"><h3>Evidence-led context</h3><p>Keep source facts distinct from sales assumptions.</p></div><div class="feature"><h3>Editable messaging</h3><p>Review and refine before contacting anyone.</p></div><div class="feature"><h3>Connected journey</h3><p>Move from research to prospect to outreach.</p></div></div>`;break;
case 'Usage':out=head('Understand plan allowances and account consumption.')+stats([['Current plan','Free','From supplied screenshot','◈'],['Used analyses','0','Illustrative usage','▤'],['Remaining','10','Illustrative allowance','◷'],['Billing period','—','Refer to account for dates','▦']])+`<section class="surface surfacepad"><h2>Analysis allowance</h2><p>10 remaining of 10 total (illustrative; see account for authoritative values).</p><div class="progress"><span style="width:0%"></span></div><div class="note">Live usage and renewal periods should be loaded from the backend rather than hard-coded.</div></section>`;break;
case 'Billing':out=head('Review your plan and manage billing confidently.')+`<div class="billing"><div class="subhead"><div><div class="caption">CURRENT PLAN</div><h1>Free</h1><p>Individual account plan</p></div><span class="state">Active · example</span></div><p style="max-width:600px;margin-bottom:16px">Manage plan details, invoices, and upgrades in one place. Actions are placeholders until the real billing service is connected.</p><button class="btn secondary" onclick="alert('This is a design preview. Billing is not connected.')">Explore plan options</button></div><div class="features"><div class="feature"><h3>Plan allowances</h3><p>Clearly show what is included.</p></div><div class="feature"><h3>Billing history</h3><p>Only show invoices when available.</p></div><div class="feature"><h3>Account management</h3><p>Provide transparent upgrade and cancellation paths.</p></div></div>`;break;
case 'Settings':out=head('Personalize your account and prospecting preferences.')+`<div class="split"><section class="surface surfacepad"><h2>Settings categories</h2><div style="margin-top:17px">${[['♙','Profile','Personal information'],['▱','Account','Plan and billing'],['☷','Preferences','Application defaults'],['↗','Integrations','Connected services'],['♧','Notifications','Alerts and updates'],['◇','Security','Password and access']].map(([ico,lab,sub])=>`<div class="setting"><span>${ico}</span><div><b>${lab}</b><p>${sub}</p></div></div>`).join('')}</div></section><section class="surface surfacepad"><h2>Profile information</h2><p style="margin:7px 0 24px">Configure the information that informs your research experience.</p><div class="stack"><label>Display name<input class="field" style="display:block;width:100%;margin-top:6px" placeholder="Your name"></label><label>Role<select class="field" style="display:block;width:100%;margin-top:6px"><option>Select role</option><option>Freelancer</option><option>Agency</option><option>Consultant</option><option>Sales team</option></select></label><label>Services<input class="field" style="display:block;width:100%;margin-top:6px" placeholder="Services you offer"></label><button class="btn" onclick="alert('Preview only: changes were not saved.')">Save settings</button></div></section></div>`;break;
case 'Extension':out=head('Connect the browser extension to your ProspectAI workspace.')+`<section class="surface surfacepad"><div class="subhead"><h2>Chrome extension</h2><span class="state grey">Not connected · sample</span></div><p style="max-width:650px">See clear, authoritative extension connection status. Display “Connected” only after an actual integration check succeeds.</p><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:22px"><button class="btn" onclick="alert('Preview only: extension connection is not available.')">Connect extension →</button><button class="btn secondary" onclick="alert('Preview only: store URL not yet connected.')">View installation instructions</button></div></section><div class="features"><div class="feature"><h3>Analyze websites</h3><p>Research business websites while browsing.</p></div><div class="feature"><h3>Capture prospects</h3><p>Save researched businesses to your workspace.</p></div><div class="feature"><h3>Check sync status</h3><p>Confirm successful connection and transfer.</p></div></div>`;break;}
target.innerHTML=out+`<div class="note">Redesign concept based on your screenshots. Metrics and states are illustrative; no live account data or backend actions are connected.</div>`} document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('theme').textContent=document.body.classList.contains('dark')?'☀':'☾'};renderNav();render();</script></body></html>
